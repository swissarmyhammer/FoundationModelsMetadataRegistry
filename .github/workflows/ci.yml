name: CI

# The org test contract (swissarmyhammer/workflows' README) applies here in
# full, and this repository satisfies it with a nested integration package:
#
# - `swift test` at the root runs every unit test this repository has, and
#   only unit tests. The suite that needs a real model lives in the nested
#   `IntegrationTests/` package, which the root manifest never names, so the
#   root run cannot see it.
# - No environment variable selects a suite. This workflow gives the shared
#   workflow no `integration-gate-env` (a LEGACY input, kept only for
#   callers that have not migrated, and refused beside the package path);
#   the package path selects the suite by build graph instead.
# - The shared workflow's unit job builds the nested package on every run,
#   because the root build does not compile it and a broken integration test
#   must not stay unseen between runs. Its integration job then builds and
#   runs that package, ordered after the unit job by the shared workflow's
#   own internal `needs:` edge.
# - MLX is in this dependency graph through FoundationModelsExtras, and the
#   integration suite loads a real MLX embedding model through
#   `PooledEmbedder`. Thus this workflow gives `integration-metallib-glob`:
#   the shared workflow copies the `default.metallib` that SwiftPM puts in
#   the Cmlx bundle beside each `.xctest` bundle before the run.
#   `CIWorkflowTests` pins the delegation, and the two inputs, from this side.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: swissarmyhammer/workflows/.github/workflows/swift-ci.yaml@main
    with:
      integration-package-path: IntegrationTests
      integration-metallib-glob: "*Cmlx*/default.metallib"
