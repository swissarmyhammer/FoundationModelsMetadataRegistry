name: CI

# The org test contract (swissarmyhammer/workflows' README) applies here in
# full, and this repository satisfies it with unit tests only:
#
# - `swift test` at the root runs every test this repository has, and only
#   unit tests. There is no integration suite: no test needs a real model, a
#   network, a GPU, or much wall-clock time.
# - No environment variable selects a suite. This workflow gives the shared
#   workflow no `integration-gate-env` (a LEGACY input, kept only for
#   callers that have not migrated).
# - The shared workflow's integration job is gated on `integration-gate-env`,
#   `integration-filter`, `integration-skip`, or `integration-package-path`
#   being non-empty. This workflow passes none of them, so that job never
#   runs and the unit job is the whole of CI. Every input of the shared
#   workflow is optional, so the bare `uses:` below is a valid call.
#   `CIWorkflowTests` pins the delegation, and the absence of every
#   `integration-*` input, from this side.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: swissarmyhammer/workflows/.github/workflows/swift-ci.yaml@main
